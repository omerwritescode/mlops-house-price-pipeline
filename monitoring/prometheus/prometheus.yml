global:
  scrape_interval: 10s
  evaluation_interval: 15s
rule_files: [alerts.yml]
scrape_configs:
  - job_name: hpp-api            # live operational metrics from the FastAPI service
    metrics_path: /metrics
    static_configs: [{targets: ["api:8000"]}]
  - job_name: hpp-monitor        # batch drift/performance metrics pushed by `hpp monitor`
    honor_labels: true
    static_configs: [{targets: ["pushgateway:9091"]}]
